# EJECUCIÓN PRINCIPAL
# ============================================================
def main():
    print("=" * 75)
    print("  TRINIDAD SYSTEM — Ejecucion Diaria")
    print(f"  {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}")
    print("=" * 75)
    dp = DataProvider()
    # 1. L'CRACK
    print("\n" + "=" * 40)
    print("  PASO 1: L'CRACK SECTORIAL")
    print("=" * 40)
    lcrack = LCrackV72(dp)
    lcrack_data = lcrack.run()
    regime = lcrack_data.get('regime', 1)
    # 2. PISTOLERO
    print("\n" + "=" * 40)
    print("  PASO 2: PISTOLERO STOCK PICKING")
    print("=" * 40)
    pistolero = PistoleroV31(dp)
    pistolero_data = pistolero.run(regime=regime)
    # 3. Guardar resultados
    output_dir = Path("output")
    output_dir.mkdir(exist_ok=True)
    combined = {
        "lcrack": lcrack_data,
        "pistolero": pistolero_data,
        "generated_at": datetime.now().isoformat(),
        "version": "v7.2 + v3.1",
    }
    with open(output_dir / "results.json", "w") as f:
        json.dump(combined, f, indent=2, default=str)
    print(f"\n  Resultados guardados en output/results.json")
    print("  TRINIDAD SYSTEM completado.")
    return combined
if __name__ == "__main__":
    main()
