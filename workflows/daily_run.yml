# L'CRACK v7.2 — HMM ESTABILIZADO + PERCENTILES
# ============================================================
class LCrackV72:
    LCRACK_ETFS = {
        "SPY": "SP500", "QQQ": "Nasdaq100", "IWM": "Small Caps",
        "UUP": "Dolar", "BIL": "Efectivo", "TLT": "Bonos LP",
        "SHY": "Bonos CP", "TIP": "TIPS", "HYG": "High Yield", "LQD": "Inv Grade",
        "XLK": "Tecnologia", "AIQ": "IA", "SMH": "Semiconductores",
        "BOTZ": "IA-Robotica", "XLC": "Comunicaciones", "HACK": "Ciberseguridad",
        "XLE": "Energia", "URA": "Uranio", "XME": "Mineria",
        "GLD": "Oro", "SLV": "Plata", "DBA": "Agricolas",
        "XLF": "Bancos", "KIE": "Seguros", "XLI": "Industria",
        "IYT": "Transporte", "ITA": "Defensa",
        "XLP": "Consumo Basico", "XLY": "Consumo Lujo", "XLV": "Salud",
        "XLU": "Utilities", "XLRE": "Inmuebles",
        "EZU": "Europa", "FXI": "China", "EEM": "Emergentes",
        "VTV": "Value", "BTC-USD": "Crypto",
    }
    MACRO_FILTERS = ["SP500", "Nasdaq100", "Small Caps", "Dolar", "Efectivo",
                     "Bonos LP", "Bonos CP", "TIPS", "High Yield", "Inv Grade"]
    RISK_ON_SECTORS = ["Tecnologia", "IA", "Semiconductores", "Crypto", "Small Caps", "IA-Robotica", "Consumo Lujo"]
    DEFENSIVE_SECTORS = ["Consumo Basico", "Utilities", "Salud", "Oro", "Plata"]
    def __init__(self, dp):
        self.dp = dp
        self.df_p = pd.DataFrame()
        self.df_v = pd.DataFrame()
        self.regime_data = {}
    def _load_prices(self):
        raw, vols = {}, {}
        tickers_to_download = list(self.LCRACK_ETFS.keys())
        print(f"    Descargando {len(tickers_to_download)} tickers...")
        bulk = self.dp.get_bulk_prices(tickers_to_download, period="6y")
        for ticker, sector in self.LCRACK_ETFS.items():
            if sector in raw:
                continue
            df = bulk.get(ticker)
            if df is None or len(df) < 100:
                continue
            raw[sector] = df["close"].rename(sector)
            if "volume" in df.columns:
                vols[sector] = df["volume"].rename(sector)
        if not raw:
            raise ValueError("ERROR: Sin datos de ETFs")
        self.df_p = pd.DataFrame(raw).ffill().dropna(how="all")
        self.df_v = pd.DataFrame(vols).reindex(self.df_p.index).ffill().fillna(0) if vols else pd.DataFrame()
        for col in self.df_p.columns:
            v0 = self.df_p[col].first_valid_index()
            if v0 and self.df_p[col].loc[v0] != 0:
                self.df_p[col] = self.df_p[col] / self.df_p[col].loc[v0] * 100
        print(f"    Universo cargado: {len(self.df_p.columns)} sectores, {len(self.df_p)} días de datos")
    def _detect_regime_hmm_ensemble(self):
        spy = self.df_p.get("SP500")
        if spy is None or _hmm_lib is None:
            return 1, 0.0, 0.0, 0.0, {}
        rets = spy.pct_change().dropna()
        vol = rets.rolling(21).std().dropna()
        common = rets.index.intersection(vol.index)
        if len(common) < 200:
            return 1, 0.0, 0.0, 0.0, {}
        X = np.column_stack([rets.loc[common].values, vol.loc[common].values])
        scaler = StandardScaler()
        X_scaled = scaler.fit_transform(X)
        seeds = [42, 123, 256, 789, 1024]
        ensemble_votes = []
        ensemble_probs = []
        window_states = []
        details = {}
        for i, seed in enumerate(seeds):
            try:
                model = _hmm_lib.GaussianHMM(
                    n_components=3, covariance_type="full",
                    n_iter=500, min_covar=0.001, random_state=seed
                )
                model.fit(X_scaled)
                states = model.predict(X_scaled)
                means = [X_scaled[states == s, 0].mean() for s in range(3)]
                order = np.argsort(means)
                remap = {order[0]: 0, order[1]: 1, order[2]: 2}
                last_5 = [remap[s] for s in states[-5:]]
                from collections import Counter
                vote = Counter(last_5).most_common(1)[0][0]
                ensemble_votes.append(vote)
                probs = model.predict_proba(X_scaled)
                ensemble_probs.append(float(probs[-1, states[-1]]))
                if i == 0:
                    window_states = [
                        {0: "BEAR", 1: "LATERAL", 2: "BULL"}[s] for s in last_5
                    ]
            except Exception:
                ensemble_votes.append(1)
                ensemble_probs.append(0.5)
        from collections import Counter
        vote_counts = Counter(ensemble_votes)
        regime = vote_counts.most_common(1)[0][0]
        consensus = vote_counts[regime] / len(ensemble_votes)
        if consensus < 0.6:
            regime = 1
        last_obs = X_scaled[-1]
        ret_z = float(last_obs[0])
        vol_z = float(last_obs[1])
        avg_prob = float(np.mean(ensemble_probs))
        labels = {0: "BEAR", 1: "LATERAL", 2: "BULL"}
        vote_labels = [labels[v] for v in ensemble_votes]
        details = {
            "votos": vote_labels,
            "bear": vote_counts.get(0, 0),
            "lateral": vote_counts.get(1, 0),
            "bull": vote_counts.get(2, 0),
            "prob_media": round(avg_prob * 100, 1),
            "window": window_states,
            "consenso_pct": round(consensus * 100, 1),
        }
        return regime, consensus, ret_z, vol_z, details
    def _calc_zrisk(self):
        try:
            hyg = self.df_p.get("High Yield")
            lqd = self.df_p.get("Inv Grade")
            spread = (hyg / lqd).pct_change(21) if hyg is not None and lqd is not None else pd.Series(0, index=self.df_p.index)
            current_returns = self.df_p.pct_change(21).iloc[-1]
            risk_perf = current_returns[[s for s in self.RISK_ON_SECTORS if s in current_returns]].mean()
            def_perf = current_returns[[s for s in self.DEFENSIVE_SECTORS if s in current_returns]].mean()
            spread_z = (spread.iloc[-1] - spread.rolling(63).mean().iloc[-1]) / (spread.rolling(63).std().iloc[-1] + 1e-6)
            bias_z = (risk_perf - def_perf) * 10
            return float(np.clip(bias_z - spread_z, -3, 3))
        except Exception:
            return 0.0
    def _calc_metrics(self):
        mom = (self.df_p / self.df_p.rolling(126, min_periods=60).mean() - 1).rank(pct=True, axis=1)
        trend = (self.df_p / self.df_p.rolling(200, min_periods=100).mean() - 1).rank(pct=True, axis=1)
        cfr = 0.45 * mom + 0.55 * trend
        gf_accel = (self.df_p.pct_change(5).rolling(5).mean() - self.df_p.pct_change(20).rolling(20).mean()) * 100
        gf_vol = gf_accel.rolling(63, min_periods=20).std()
        gf_z = gf_accel.iloc[-1] / gf_vol.iloc[-1].replace(0, np.nan)
        gf_z = gf_z.fillna(0)
        w = self.df_p.divide(self.df_p.sum(axis=1), axis=0)
        w_mean_7 = w.rolling(7).mean()
        w_std_7 = w.rolling(7).std()
        delta_w = w.iloc[-1] - w_mean_7.iloc[-1]
        rot_z = delta_w / (w_std_7.iloc[-1] + 0.0001)
        rvol = pd.Series(1.0, index=self.df_p.columns)
        if not self.df_v.empty:
            vol_today = self.df_v.iloc[-1]
            vol_avg_20 = self.df_v.rolling(20).mean().iloc[-1]
            rvol = vol_today / (vol_avg_20 + 1e-6)
        return cfr.iloc[-1], gf_z, rot_z, rvol
    def _check_exit_signals(self, gf_z, rvol):
        if gf_z > 1.5 and rvol < 0.8:
            return "SALIDA SUGERIDA", "Precio sube sin volumen (Trampa)."
        if abs(gf_z) < 0.5 and rvol > 2.0:
            return "DISTRIBUCION", "Alto volumen sin precio. Instituciones vendiendo."
        return None, None
    def _assign_status_by_percentile(self, rows, regime):
        if not rows:
            return rows
        scores = []
        for r in rows:
            if r.get('_exit'):
                scores.append(-999)
            else:
                gfz_r = pd.Series([x['GF_Z'] for x in rows if not x.get('_exit')]).rank(pct=True)
                rotz_r = pd.Series([x['Rot_Z'] for x in rows if not x.get('_exit')]).rank(pct=True)
                rvol_r = pd.Series([x['RVOL'] for x in rows if not x.get('_exit')]).rank(pct=True)
                scores.append(0)
        non_exit = [r for r in rows if not r.get('_exit')]
        if not non_exit:
            return rows
        gfz_vals = pd.Series([r['GF_Z'] for r in non_exit])
        rotz_vals = pd.Series([r['Rot_Z'] for r in non_exit])
        rvol_vals = pd.Series([r['RVOL'] for r in non_exit])
        gfz_rank = gfz_vals.rank(pct=True)
        rotz_rank = rotz_vals.rank(pct=True)
        rvol_rank = rvol_vals.rank(pct=True)
        composite = 0.50 * gfz_rank + 0.25 * rotz_rank + 0.25 * rvol_rank
        idx = 0
        for r in rows:
            if r.get('_exit'):
                continue
            pctl = composite.iloc[idx]
            gfz = r['GF_Z']
            rotz = r['Rot_Z']
            rvol = r['RVOL']
            if pctl >= 0.85:
                if rvol > 1.2 and rotz > 0.3:
                    r['Status'] = "LIDER INSTITUCIONAL"
                    r['Notas'] = "Confluencia: momentum + rotacion + volumen."
                    r['Emoji'] = "whale"
                else:
                    r['Status'] = "LIDER TECNICO"
                    r['Notas'] = "Momentum fuerte."
                    r['Emoji'] = "rocket"
            elif pctl >= 0.65:
                r['Status'] = "MEJORANDO"
                r['Notas'] = "Ganando fuerza relativa."
                r['Emoji'] = "up"
            elif pctl >= 0.35:
                r['Status'] = "NEUTRO"
                r['Notas'] = "Sin senal clara."
                r['Emoji'] = "neutral"
            elif pctl >= 0.15:
                r['Status'] = "DEBILITANDOSE"
                r['Notas'] = "Perdiendo fuerza relativa."
                r['Emoji'] = "down"
            else:
                if gfz < -2.0 and rotz < -0.5:
                    r['Status'] = "SALIENDO"
                    r['Notas'] = "Salida de capital detectada."
                    r['Emoji'] = "exit"
                else:
                    r['Status'] = "REZAGADO"
                    r['Notas'] = "Sin fuerza."
                    r['Emoji'] = "warning"
            r['Percentil'] = round(float(pctl * 100), 1)
            idx += 1
        return rows
    def run(self):
        print("=" * 75)
        print("  L'CRACK v7.2 — HMM ESTABILIZADO + PERCENTILES")
        print("=" * 75)
        if self.df_p.empty:
            self._load_prices()
        regime, consensus, ret_z, vol_z, details = self._detect_regime_hmm_ensemble()
        regime_labels = {0: "BEAR (Miedo)", 1: "LATERAL (Indecision)", 2: "BULL (Optimismo)"}
        print(f"\n  HMM ESTABILIZADO (Ensemble x5)")
        print(f"  Estado Actual : {regime_labels.get(regime, '?')}")
        print(f"  Consenso      : {details.get('consenso_pct', 0)}% ({details.get(regime_labels.get(regime, '').split()[0].lower(), 0)}/5 modelos)")
        print(f"  Input Retorno : {ret_z:+.2f} Sigmas")
        print(f"  Input Volatil.: {vol_z:+.2f} Sigmas")
        z_risk = self._calc_zrisk()
        print(f"\n  Z-RISK SISTEMA: {z_risk:.2f}")
        cfr_s, gf_z_s, rot_z_s, rvol_s = self._calc_metrics()
        investable = [s for s in self.df_p.columns if s not in self.MACRO_FILTERS]
        rows = []
        for sector in investable:
            gfz = float(gf_z_s.get(sector, 0))
            rotz = float(rot_z_s.get(sector, 0))
            rv = float(rvol_s.get(sector, 1.0))
            etf_ticker = [k for k, v in self.LCRACK_ETFS.items() if v == sector][0]
            exit_status, exit_note = self._check_exit_signals(gfz, rv)
            r = {
                "Sector": sector, "ETF": etf_ticker,
                "GF_Z": round(gfz, 2), "Rot_Z": round(rotz, 2), "RVOL": round(rv, 2),
                "Status": "", "Notas": "", "Emoji": "", "Percentil": 50.0,
                "_exit": False
            }
            if exit_status:
                r['Status'] = exit_status
                r['Notas'] = exit_note
                r['Emoji'] = "exit"
                r['_exit'] = True
            if regime == 0 and sector in self.RISK_ON_SECTORS and not r['_exit']:
                r['Notas'] += " PELIGRO EN BEAR"
                r['Emoji'] = "danger"
            rows.append(r)
        rows = self._assign_status_by_percentile(rows, regime)
        rows.sort(key=lambda x: x.get('Percentil', 50), reverse=True)
        exit_rows = [r for r in rows if r['_exit']]
        normal_rows = [r for r in rows if not r['_exit']]
        rows = exit_rows + normal_rows
        for r in rows:
            del r['_exit']
        self.regime_data = {
            "regime": regime,
            "regime_label": regime_labels.get(regime, "?"),
            "consensus": details.get('consenso_pct', 0),
            "ret_z": round(ret_z, 2),
            "vol_z": round(vol_z, 2),
            "z_risk": round(z_risk, 2),
            "details": details,
            "sectors": rows,
            "timestamp": datetime.now().isoformat(),
        }
        # Print tabla
        print(f"\n  {'#':<3} {'Sector':<16} {'ETF':<8} {'GF_Z':>7} {'Rot_Z':>7} {'RVOL':>6} {'Status':<25}")
        print("  " + "-" * 90)
        for i, r in enumerate(rows):
            emoji_map = {"whale": "D ", "rocket": "* ", "up": "+ ", "neutral": "  ",
                         "down": "- ", "exit": "X ", "warning": "! ", "danger": "! "}
            prefix = emoji_map.get(r['Emoji'], '  ')
            print(f"{prefix}{i+1:<3} {r['Sector']:<16} {r['ETF']:<8} {r['GF_Z']:>7.2f} {r['Rot_Z']:>7.2f} {r['RVOL']:>6.2f} {r['Status']:<25}")
        return self.regime_data
