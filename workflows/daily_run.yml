    def _get_universe(self):
        all_tickers = set()
        indices = {}
        scraping_sources = [
            ('S&P500', 'https://en.wikipedia.org/wiki/List_of_S%26P_500_companies', 0, ''),
            ('Nasdaq100', 'https://en.wikipedia.org/wiki/Nasdaq-100', 4, ''),
            ('DAX', 'https://en.wikipedia.org/wiki/DAX', 4, '.DE'),
            ('IBEX35', 'https://es.wikipedia.org/wiki/IBEX_35', 1, '.MC'),
        ]
        headers = {'User-Agent': 'Mozilla/5.0'}
        for idx_name, url, table_idx, suffix in scraping_sources:
            try:
                resp = requests.get(url, headers=headers, timeout=15)
                tables = pd.read_html(StringIO(resp.text))
                df_t = tables[table_idx]
                col = [c for c in df_t.columns if any(x in str(c) for x in ['Symbol', 'Ticker', 'Componente'])][0]
                count = 0
                for t in df_t[col].astype(str):
                    clean = t.split(' ')[0].replace('.', '-').strip()
                    if suffix:
                        base = clean.split('-')[0]
                        clean = base + suffix
                    all_tickers.add(clean)
                    indices[clean] = idx_name
                    count += 1
                print(f"    {idx_name}: {count} tickers")
            except Exception:
                print(f"    {idx_name}: FALLO scraping")
                continue
        if len(all_tickers) < 50:
            print(f"    Usando fallback: {len(self.FALLBACK_UNIVERSE)} tickers")
            for t in self.FALLBACK_UNIVERSE:
                all_tickers.add(t)
                if t not in indices:
                    indices[t] = "Fallback"
        for t in self.FAVORITOS:
            all_tickers.add(t)
            if t not in indices:
                indices[t] = "Favorito"
        print(f"  Universo total: {len(all_tickers)} tickers")
        return list(all_tickers), indices
    def _get_sector(self, ticker):
        try:
            info = yf.Ticker(ticker).info
            return info.get('sector', 'N/A')
        except Exception:
            return 'N/A'
    def _get_sectors_bulk(self, tickers):
        sectors = {}
        print(f"  Obteniendo sectores ({len(tickers)} tickers)...")
        with ThreadPoolExecutor(max_workers=10) as executor:
            futures = {executor.submit(self._get_sector, t): t for t in tickers}
            for future in as_completed(futures):
                t = futures[future]
                try:
                    sectors[t] = future.result()
                except Exception:
                    sectors[t] = 'N/A'
        return sectors
    def run(self, regime=1, max_tickers=None):
        print("=" * 75)
        print("  PISTOLERO v3.1 — Quality Momentum (Universo Ampliado)")
        print("=" * 75)
        tickers, indices = self._get_universe()
        if max_tickers:
            must_have = set(self.FAVORITOS)
            others = [t for t in tickers if t not in must_have]
            tickers = list(must_have) + others[:max_tickers - len(must_have)]
        print(f"\n  Descargando precios...")
        bulk_data = self.dp.get_bulk_prices(tickers, period="1y")
        valid_tickers = [t for t in tickers if t in bulk_data and len(bulk_data[t]) >= 60]
        print(f"  Tickers validos: {len(valid_tickers)}/{len(tickers)}")
        sectors = self._get_sectors_bulk(valid_tickers)
        print(f"  Calculando features...")
        results = []
        for i, t in enumerate(valid_tickers):
            if (i + 1) % 100 == 0:
                print(f"    ... {i+1}/{len(valid_tickers)}")
            try:
                df = bulk_data[t]
                feat = self.dp.compute_features(df)
                if feat is None or feat.empty:
                    continue
                last = feat.iloc[-1]
                def rank_norm(vals):
                    s = pd.Series(vals)
                    return s.rank(pct=True).iloc[-1] if len(s) > 0 else 0.5
                f_mom = 0
                for col in ['ret_5d', 'ret_20d', 'ret_60d', 'ret_120d']:
                    if col in last.index:
                        f_mom += last[col]
                f_mom = f_mom / 4 if f_mom != 0 else 0
                f_trend = last.get('dist_ma200', 0)
                f_vol = -last.get('vol_20d', 0.3)
                f_accel = last.get('mom_5_20', 0) + last.get('mom_10_50', 0)
                f_volume = last.get('vrel_5d', 1.0)
                f_macd = 1 if last.get('macd', 0) > last.get('macd_signal', 0) else -1
                f_max = last.get('max20_ratio', 1.0)
                results.append({
                    'ticker': t,
                    'sector': sectors.get(t, 'N/A'),
                    'index': indices.get(t, 'N/A'),
                    'f_mom': f_mom, 'f_trend': f_trend, 'f_vol': f_vol,
                    'f_accel': f_accel, 'f_volume': f_volume,
                    'f_macd': f_macd, 'f_max': f_max,
                    'rsi_14': last.get('rsi_14', 50),
                    'slope_20': last.get('slope_20', 0),
                    'ret_5d': last.get('ret_5d', 0),
                    'ret_20d': last.get('ret_20d', 0),
                    'close': float(df['close'].iloc[-1]),
                })
            except Exception:
                continue
        if not results:
            return {"stocks": [], "regime": regime}
        df_res = pd.DataFrame(results).set_index('ticker')
        for col in ['f_mom', 'f_trend', 'f_vol', 'f_accel', 'f_volume', 'f_max']:
            df_res[col + '_r'] = df_res[col].rank(pct=True)
        rsi = df_res['rsi_14']
        rsi_penalty = np.where(rsi > 78, 0.85, np.where(rsi < 22, 0.90, 1.0))
        if regime == 0:
            weights = {'f_mom_r': 0.10, 'f_trend_r': 0.15, 'f_vol_r': 0.30,
                       'f_accel_r': 0.10, 'f_volume_r': 0.10, 'f_max_r': 0.25}
        elif regime == 2:
            weights = {'f_mom_r': 0.30, 'f_trend_r': 0.20, 'f_vol_r': 0.10,
                       'f_accel_r': 0.15, 'f_volume_r': 0.15, 'f_max_r': 0.10}
        else:
            weights = {'f_mom_r': 0.20, 'f_trend_r': 0.20, 'f_vol_r': 0.20,
                       'f_accel_r': 0.15, 'f_volume_r': 0.15, 'f_max_r': 0.10}
        score = sum(df_res[col] * w for col, w in weights.items())
        macd_bonus = df_res['f_macd'].clip(-1, 1) * 0.03
        df_res['score'] = (score + macd_bonus) * rsi_penalty
        df_res = df_res.sort_values('score', ascending=False)
        # Print
        top = df_res.head(30)
        print(f"\n  {'#':<5} {'Ticker':<9} {'Sector':<24} {'Idx':<13} {'Score':>7} {'RSI':>6} {'Mom':>8} {'Slope':>8}")
        print("  " + "-" * 85)
        for i, (ticker, row) in enumerate(top.iterrows()):
            rsi_val = row['rsi_14']
            rsi_tag = " HOT" if rsi_val > 70 else " COLD" if rsi_val < 30 else ""
            print(f"  {i+1:<5} {ticker:<9} {row['sector']:<24} {row['index']:<13} {row['score']:>7.3f} {rsi_val:>5.1f}{rsi_tag}")
        # Bottom 5
        bottom = df_res.tail(5)
        print(f"\n  --- BOTTOM 5 (EVITAR) ---")
        for i, (ticker, row) in enumerate(bottom.iterrows()):
            print(f"  {i+1}    {ticker:<9} {row['sector']:<24} {row['score']:>7.3f} {row['rsi_14']:>5.1f}")
        # Favoritos
        favs = df_res.loc[df_res.index.intersection(self.FAVORITOS)]
        if not favs.empty:
            favs = favs.sort_values('score', ascending=False)
            print(f"\n  FAVORITOS:")
            print(f"  {'Ticker':<12} {'Score':>7} {'Rank':>10} {'RSI':>6} {'Sector':<24}")
            print("  " + "-" * 60)
            total = len(df_res)
            for ticker, row in favs.iterrows():
                rank = df_res.index.get_loc(ticker) + 1
                print(f"  {ticker:<12} {row['score']:>7.3f} {rank:>4}/{total:<5} {row['rsi_14']:>5.1f} {row['sector']:<24}")
        print(f"\n  {len(df_res)} activos analizados con 34 features.")
        regime_label = {0: "BEAR", 1: "LATERAL", 2: "BULL"}.get(regime, "?")
        print(f"  Regimen: {regime_label}")
        # Build output
        stocks_list = []
        for ticker, row in df_res.iterrows():
            stocks_list.append({
                "ticker": ticker,
                "sector": row['sector'],
                "index": row['index'],
                "score": round(float(row['score']), 3),
                "rsi": round(float(row['rsi_14']), 1),
                "momentum": round(float(row.get('f_mom', 0)), 4),
                "slope": round(float(row.get('slope_20', 0)), 4),
                "close": round(float(row.get('close', 0)), 2),
                "is_favorito": ticker in self.FAVORITOS,
            })
        return {
            "stocks": stocks_list,
            "regime": regime,
            "total_analyzed": len(df_res),
            "timestamp": datetime.now().isoformat(),
        }
