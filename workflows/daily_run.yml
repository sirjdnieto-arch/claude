# DATAPROVIDER — Fuente de datos sin dependencias externas
# ============================================================
class DataProvider:
    def __init__(self):
        self._cache = {}
        print("DataProvider inicializado (yfinance + pandas)")
    def get_prices(self, ticker, period="6y"):
        if ticker in self._cache:
            return self._cache[ticker]
        try:
            df = yf.download(ticker, period=period, progress=False, auto_adjust=False)
            if df is not None and len(df) > 0:
                df.columns = [c[0].lower() if isinstance(c, tuple) else c.lower() for c in df.columns]
                self._cache[ticker] = df
                return df
        except Exception:
            pass
        return None
    def get_bulk_prices(self, tickers, period="1y"):
        results = {}
        tickers_str = " ".join(tickers)
        try:
            data = yf.download(tickers_str, period=period, progress=False,
                             group_by='ticker', auto_adjust=False, threads=True)
            if data is not None and not data.empty:
                for t in tickers:
                    try:
                        if len(tickers) == 1:
                            df_t = data.copy()
                        else:
                            df_t = data[t].copy() if t in data.columns.get_level_values(0) else None
                        if df_t is not None and not df_t.empty:
                            df_t.columns = [c.lower() if isinstance(c, str) else c[0].lower() if isinstance(c, tuple) else str(c).lower() for c in df_t.columns]
                            df_t = df_t.dropna(subset=['close'])
                            if len(df_t) > 0:
                                results[t] = df_t
                    except Exception:
                        continue
        except Exception:
            pass
        # Fallback individual para los que fallaron
        missing = [t for t in tickers if t not in results]
        for t in missing:
            df = self.get_prices(t, period=period)
            if df is not None:
                results[t] = df
        return results
    def compute_features(self, df):
        if df is None or len(df) < 60:
            return None
        c = df['close']
        v = df.get('volume', pd.Series(0, index=df.index))
        feat = pd.DataFrame(index=df.index)
        for w in [5, 10, 20, 60, 120]:
            feat[f'ret_{w}d'] = c.pct_change(w)
        feat['ret_1d'] = c.pct_change(1)
        feat['mom_5_20'] = c.pct_change(5).rolling(5).mean() - c.pct_change(20).rolling(20).mean()
        feat['mom_10_50'] = c.pct_change(10).rolling(10).mean() - c.pct_change(50).rolling(50).mean()
        feat['mom_20_120'] = c.pct_change(20).rolling(20).mean() - c.pct_change(120).rolling(120).mean()
        for w in [20, 50, 200]:
            ma = c.rolling(w).mean()
            feat[f'dist_ma{w}'] = (c - ma) / ma
        for w in [5, 10, 20, 60]:
            feat[f'vol_{w}d'] = c.pct_change().rolling(w).std() * np.sqrt(252)
        feat['vol_ratio_5_20'] = feat['vol_5d'] / (feat['vol_20d'] + 1e-10)
        feat['vol_ratio_20_60'] = feat['vol_20d'] / (feat['vol_60d'] + 1e-10)
        for w in [5, 10, 20]:
            vol_ma = v.rolling(w).mean()
            feat[f'vrel_{w}d'] = v / (vol_ma + 1)
        feat['vol_price_corr'] = c.pct_change().rolling(20).corr(v.pct_change())
        obv = (np.sign(c.diff()) * v).cumsum()
        feat['obv_slope'] = obv.rolling(20).apply(
            lambda x: np.polyfit(range(len(x)), x / (x.abs().max() + 1), 1)[0] if len(x) == 20 else 0,
            raw=False
        )
        for w in [7, 14, 28]:
            delta = c.diff()
            gain = delta.where(delta > 0, 0).rolling(w).mean()
            loss = (-delta.where(delta < 0, 0)).rolling(w).mean()
            rs = gain / (loss + 1e-10)
            feat[f'rsi_{w}'] = 100 - (100 / (1 + rs))
        h = df.get('high', c)
        l = df.get('low', c)
        feat['daily_range'] = (h - l) / (c + 1e-10)
        tr = pd.concat([h - l, (h - c.shift()).abs(), (l - c.shift()).abs()], axis=1).max(axis=1)
        feat['atr_14'] = tr.rolling(14).mean() / (c + 1e-10)
        feat['max20_ratio'] = c / c.rolling(20).max()
        feat['min20_ratio'] = c / c.rolling(20).min()
        for w in [20, 60]:
            feat[f'slope_{w}'] = c.rolling(w).apply(
                lambda x: np.polyfit(range(len(x)), x / x.iloc[0], 1)[0] if len(x) == w else 0,
                raw=False
            )
        ema12 = c.ewm(span=12).mean()
        ema26 = c.ewm(span=26).mean()
        feat['macd'] = (ema12 - ema26) / c
        feat['macd_signal'] = feat['macd'].ewm(span=9).mean()
        feat = feat.replace([np.inf, -np.inf], np.nan)
        return feat.dropna()
