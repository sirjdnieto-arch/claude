name: Trinidad System - Daily Analysis

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python main.py
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Guardar y Publicar
        run: |
          git config --global user.name "TrinidadBot"
          git config --global user.email "bot@trinidad.com"
          # Aseguramos que el index.html esté en la raíz para GitHub Pages
          git add index.html output/results.json
          git commit -m "Trinidad System Update: $(date)" || echo "No hay cambios"
          git push
